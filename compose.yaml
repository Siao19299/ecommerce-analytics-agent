services:
  offline-check:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: ecommerce-agent-offline-check:local
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      PYTHONPYCACHEPREFIX: /tmp/pycache
    command: ["python", "-m", "src.ecommerce_agent.offline_check"]
